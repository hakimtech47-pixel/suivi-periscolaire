<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Suivi Périscolaire</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-12 select-none">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none px-4 py-2 rounded-lg text-xs font-semibold shadow-lg text-white"></div>

  <!-- En-tête -->
  <header class="bg-blue-600 text-white p-4 sticky top-0 shadow-md flex justify-between items-center z-10">
    <div>
      <h1 class="text-base font-bold leading-tight">Suivi Périscolaire</h1>
      <p class="text-[11px] text-blue-100" id="currentDateDisplay"></p>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="ouvrirModalTarifs()" title="Paramètres des tarifs" class="bg-blue-700 hover:bg-blue-800 active:scale-95 text-xs p-2 rounded-lg border border-blue-400 transition">
        ⚙️
      </button>
      <button onclick="exporterExcel()" class="bg-blue-700 hover:bg-blue-800 active:scale-95 text-xs px-3 py-1.5 rounded-lg border border-blue-400 font-medium transition">
        Export .xlsx
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Formulaire de saisie -->
    <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200">
      <h2 class="font-bold text-slate-800 mb-3 text-sm flex items-center justify-between border-b pb-2">
        <span>Saisie de la journée</span>
        <button type="button" onclick="initAujourdhui()" class="text-xs text-blue-600 font-medium hover:underline">Aujourd'hui</button>
      </h2>

      <form id="periscoForm" class="space-y-4">
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Date</label>
            <input type="date" id="dateInput" required class="w-full bg-slate-50 border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Période</label>
            <select id="periodeInput" class="w-full bg-slate-50 border rounded-lg p-2 text-sm">
              <option value="Scolaire">Scolaire</option>
              <option value="Mercredi">Mercredi</option>
              <option value="Vacances">Vacances</option>
            </select>
          </div>
        </div>

        <!-- Cantine scolaire -->
        <label class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border cursor-pointer active:bg-slate-100">
          <span class="text-sm font-semibold text-slate-700">Repas cantine scolaire</span>
          <input type="checkbox" id="cantineInput" class="w-5 h-5 accent-blue-600 rounded">
        </label>

        <!-- Garderie Matin -->
        <div class="p-3 bg-slate-50 rounded-xl border space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-600 uppercase">Garderie Matin</span>
            <span id="labelDureeMatin" class="text-xs font-medium text-blue-600"></span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="flex justify-between text-[11px] text-slate-500 mb-0.5">
                <span>Arrivée</span>
                <button type="button" onclick="setHeureActuelle('matinArrivee')" class="text-blue-600 font-bold hover:underline">Maintenant</button>
              </div>
              <input type="time" id="matinArrivee" onchange="majDureesDirect()" class="w-full bg-white border rounded-lg p-2 text-sm">
            </div>
            <div>
              <div class="flex justify-between text-[11px] text-slate-500 mb-0.5">
                <span>Départ</span>
                <button type="button" onclick="setHeureActuelle('matinDepart')" class="text-blue-600 font-bold hover:underline">Maintenant</button>
              </div>
              <input type="time" id="matinDepart" onchange="majDureesDirect()" class="w-full bg-white border rounded-lg p-2 text-sm">
            </div>
          </div>
        </div>

        <!-- Garderie Soir -->
        <div class="p-3 bg-slate-50 rounded-xl border space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-600 uppercase">Garderie Soir</span>
            <span id="labelDureeSoir" class="text-xs font-medium text-blue-600"></span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="flex justify-between text-[11px] text-slate-500 mb-0.5">
                <span>Arrivée</span>
                <button type="button" onclick="setHeureActuelle('soirArrivee')" class="text-blue-600 font-bold hover:underline">Maintenant</button>
              </div>
              <input type="time" id="soirArrivee" onchange="majDureesDirect()" class="w-full bg-white border rounded-lg p-2 text-sm">
            </div>
            <div>
              <div class="flex justify-between text-[11px] text-slate-500 mb-0.5">
                <span>Départ</span>
                <button type="button" onclick="setHeureActuelle('soirDepart')" class="text-blue-600 font-bold hover:underline">Maintenant</button>
              </div>
              <input type="time" id="soirDepart" onchange="majDureesDirect()" class="w-full bg-white border rounded-lg p-2 text-sm">
            </div>
          </div>
        </div>

        <!-- Centre de Loisirs -->
        <div class="p-3 bg-slate-50 rounded-xl border space-y-2">
          <span class="text-xs font-bold text-slate-600 uppercase block">Centre de Loisirs</span>
          <select id="centrePresence" class="w-full bg-white border rounded-lg p-2 text-sm">
            <option value="Aucun">Aucun</option>
            <option value="Journée entière">Journée entière</option>
            <option value="Demi-journée matin">Demi-journée matin</option>
            <option value="Demi-journée après-midi">Demi-journée après-midi</option>
          </select>
          <label class="flex items-center justify-between pt-1 cursor-pointer">
            <span class="text-xs font-medium text-slate-700">Repas pris au centre</span>
            <input type="checkbox" id="centreRepas" class="w-4 h-4 accent-blue-600 rounded">
          </label>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Notes / Remarques</label>
          <input type="text" id="notesInput" placeholder="Ex : retard, sortie..." class="w-full bg-slate-50 border rounded-lg p-2 text-sm">
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm shadow transition active:scale-[0.99]">
          Enregistrer la journée
        </button>
      </form>
    </div>

    <!-- Tableau de bord mensuel -->
    <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-slate-800 text-sm">Bilan mensuel</h2>
        <input type="month" id="filtreMois" onchange="actualiserAffichage()" class="bg-slate-50 border rounded-lg p-1 text-xs font-semibold text-slate-700">
      </div>
      
      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="p-2.5 bg-blue-50 rounded-xl">
          <div class="text-[11px] text-blue-600 font-semibold">Cantine</div>
          <div id="statRepas" class="text-lg font-black text-blue-950">0</div>
        </div>
        <div class="p-2.5 bg-blue-50 rounded-xl">
          <div class="text-[11px] text-blue-600 font-semibold">Garderie</div>
          <div id="statGarderie" class="text-lg font-black text-blue-950">0h00</div>
        </div>
        <div class="p-2.5 bg-slate-50 rounded-xl">
          <div class="text-[11px] text-slate-500 font-semibold">Centre</div>
          <div id="statCentre" class="text-lg font-black text-slate-800">0 j</div>
        </div>
        <div class="p-2.5 bg-emerald-50 rounded-xl">
          <div class="text-[11px] text-emerald-700 font-semibold">Coût estimé</div>
          <div id="statCout" class="text-lg font-black text-emerald-800">0,00 €</div>
        </div>
      </div>
    </div>

    <!-- Historique -->
    <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200">
      <h2 class="font-bold text-slate-800 mb-2 text-sm">Détail du mois sélectionné</h2>
      <div id="historiqueList" class="space-y-2 text-xs divide-y divide-slate-100"></div>
    </div>

  </main>

  <!-- Modale Paramétrage des Tarifs -->
  <div id="modalTarifs" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-xl border max-w-sm w-full p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm">Grille tarifaire (€)</h3>
        <button onclick="fermerModalTarifs()" class="text-slate-400 hover:text-slate-600 text-lg leading-none">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-600 font-medium mb-1">Repas cantine scolaire</label>
          <input type="number" step="0.10" id="tarifCantine" class="w-full bg-slate-50 border rounded-lg p-2 text-sm">
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">Garderie (taux horaire)</label>
          <input type="number" step="0.10" id="tarifGarderie" class="w-full bg-slate-50 border rounded-lg p-2 text-sm">
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">Centre - Journée complète</label>
          <input type="number" step="0.50" id="tarifCentreJour" class="w-full bg-slate-50 border rounded-lg p-2 text-sm">
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">Centre - Demi-journée</label>
          <input type="number" step="0.50" id="tarifCentreDemi" class="w-full bg-slate-50 border rounded-lg p-2 text-sm">
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">Centre - Repas</label>
          <input type="number" step="0.10" id="tarifCentreRepas" class="w-full bg-slate-50 border rounded-lg p-2 text-sm">
        </div>
      </div>

      <div class="flex space-x-2 pt-2 border-t">
        <button onclick="reinitialiserTarifs()" class="w-1/2 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold">
          Défaut
        </button>
        <button onclick="sauvegarderTarifs()" class="w-1/2 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg text-xs font-semibold">
          Enregistrer
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. CONFIGURATION SUPABASE ---
    const SUPABASE_URL = "https://wodajjtkfxkslablxtap.supabase.co/rest/v1";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvZGFqanRrZnhrc2xhYmx4dGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MDI3MjQsImV4cCI6MjEwNjE3ODcyNH0.V85P4KY-OwVppr579vbyxs4qf7CbAD8nbjRX2bEXUdU";
    const isSupabaseConfigured = SUPABASE_URL !== "VOTRE_PROJET_URL" && SUPABASE_ANON_KEY !== "VOTRE_CLE_PUBLIQUE_ANON";
    const supabaseClient = isSupabaseConfigured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // Cache local en mémoire
    let records = JSON.parse(localStorage.getItem('perisco_data') || '[]');

    // --- 2. GESTION DES TARIFS ---
    const TARIFS_DEFAUT = { cantine: 4.50, garderieHoraire: 2.50, centreJour: 15.00, centreDemi: 8.50, centreRepas: 4.50 };

    function getTarifs() {
      const stored = localStorage.getItem('perisco_tarifs');
      return stored ? JSON.parse(stored) : TARIFS_DEFAUT;
    }

    function ouvrirModalTarifs() {
      const tarifs = getTarifs();
      document.getElementById('tarifCantine').value = tarifs.cantine;
      document.getElementById('tarifGarderie').value = tarifs.garderieHoraire;
      document.getElementById('tarifCentreJour').value = tarifs.centreJour;
      document.getElementById('tarifCentreDemi').value = tarifs.centreDemi;
      document.getElementById('tarifCentreRepas').value = tarifs.centreRepas;
      document.getElementById('modalTarifs').classList.remove('hidden');
    }

    function fermerModalTarifs() {
      document.getElementById('modalTarifs').classList.add('hidden');
    }

    function sauvegarderTarifs() {
      const nouveauxTarifs = {
        cantine: parseFloat(document.getElementById('tarifCantine').value) || 0,
        garderieHoraire: parseFloat(document.getElementById('tarifGarderie').value) || 0,
        centreJour: parseFloat(document.getElementById('tarifCentreJour').value) || 0,
        centreDemi: parseFloat(document.getElementById('tarifCentreDemi').value) || 0,
        centreRepas: parseFloat(document.getElementById('tarifCentreRepas').value) || 0
      };
      localStorage.setItem('perisco_tarifs', JSON.stringify(nouveauxTarifs));
      fermerModalTarifs();
      actualiserAffichage();
      showToast('Tarifs mis à jour');
    }

    function reinitialiserTarifs() {
      if (confirm('Rétablir les tarifs d’origine ?')) {
        localStorage.setItem('perisco_tarifs', JSON.stringify(TARIFS_DEFAUT));
        fermerModalTarifs();
        actualiserAffichage();
        showToast('Tarifs réinitialisés');
      }
    }

    // --- 3. UTILITAIRES ET FORMULAIRE ---
    function initAujourdhui() {
      const now = new Date();
      const localDate = now.toLocaleDateString('fr-CA');
      document.getElementById('dateInput').value = localDate;
      majDateDisplay(now);
      chargerJourneeExistante(localDate);
    }

    function majDateDisplay(d) {
      const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('currentDateDisplay').innerText = d.toLocaleDateString('fr-FR', opts);
    }

    function setHeureActuelle(fieldId) {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      document.getElementById(fieldId).value = `${hh}:${mm}`;
      majDureesDirect();
    }

    function getDureeMinutes(arr, dep) {
      if (!arr || !dep) return 0;
      const [h1, m1] = arr.split(':').map(Number);
      const [h2, m2] = dep.split(':').map(Number);
      return (h2 * 60 + m2) - (h1 * 60 + m1);
    }

    function majDureesDirect() {
      const mArr = document.getElementById('matinArrivee').value;
      const mDep = document.getElementById('matinDepart').value;
      const sArr = document.getElementById('soirArrivee').value;
      const sDep = document.getElementById('soirDepart').value;

      const durM = getDureeMinutes(mArr, mDep);
      const durS = getDureeMinutes(sArr, sDep);

      document.getElementById('labelDureeMatin').innerText = (mArr && mDep) 
        ? (durM > 0 ? `${Math.floor(durM/60)}h${String(durM%60).padStart(2,'0')}` : 'Erreur heure') : '';
      document.getElementById('labelDureeSoir').innerText = (sArr && sDep) 
        ? (durS > 0 ? `${Math.floor(durS/60)}h${String(durS%60).padStart(2,'0')}` : 'Erreur heure') : '';
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg text-xs font-semibold shadow-lg text-white transition duration-300 opacity-100 ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
      setTimeout(() => { t.className += ' opacity-0 pointer-events-none'; }, 2500);
    }

    function chargerJourneeExistante(dateStr) {
      const item = records.find(r => r.date === dateStr);
      if (item) {
        document.getElementById('periodeInput').value = item.periode;
        document.getElementById('cantineInput').checked = item.cantine;
        document.getElementById('matinArrivee').value = item.matinArr || '';
        document.getElementById('matinDepart').value = item.matinDep || '';
        document.getElementById('soirArrivee').value = item.soirArr || '';
        document.getElementById('soirDepart').value = item.soirDep || '';
        document.getElementById('centrePresence').value = item.centrePresence;
        document.getElementById('centreRepas').checked = item.centreRepas;
        document.getElementById('notesInput').value = item.notes || '';
      } else {
        document.getElementById('cantineInput').checked = false;
        document.getElementById('matinArrivee').value = '';
        document.getElementById('matinDepart').value = '';
        document.getElementById('soirArrivee').value = '';
        document.getElementById('soirDepart').value = '';
        document.getElementById('centrePresence').value = 'Aucun';
        document.getElementById('centreRepas').checked = false;
        document.getElementById('notesInput').value = '';
      }
      majDureesDirect();
    }

    document.getElementById('dateInput').addEventListener('change', (e) => {
      chargerJourneeExistante(e.target.value);
    });

    // --- 4. SYNCHRONISATION SUPABASE ---
    async function chargerDonneesSupabase() {
      if (!isSupabaseConfigured) {
        actualiserAffichage();
        return;
      }
      try {
        const { data, error } = await supabaseClient
          .from('pointages')
          .select('*')
          .order('date', { ascending: false });

        if (error) throw error;

        if (data) {
          records = data.map(r => ({
            date: r.date,
            periode: r.periode,
            cantine: r.cantine,
            matinArr: r.matin_arr,
            matinDep: r.matin_dep,
            dureeMatin: r.duree_matin,
            soirArr: r.soir_arr,
            soirDep: r.soir_dep,
            dureeSoir: r.duree_soir,
            centrePresence: r.centre_presence,
            centreRepas: r.centre_repas,
            notes: r.notes
          }));
          localStorage.setItem('perisco_data', JSON.stringify(records));
          actualiserAffichage();
        }
      } catch (err) {
        console.warn("Connexion distante échouée, mode local utilisé :", err.message);
        actualiserAffichage();
      }
    }

    // --- 5. SOUMISSION & ENREGISTREMENT ---
    document.getElementById('periscoForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const date = document.getElementById('dateInput').value;
      const mArr = document.getElementById('matinArrivee').value;
      const mDep = document.getElementById('matinDepart').value;
      const sArr = document.getElementById('soirArrivee').value;
      const sDep = document.getElementById('soirDepart').value;

      if ((mArr && !mDep) || (!mArr && mDep)) {
        showToast('Garderie matin : arrivée et départ requis', true);
        return;
      }
      if (mArr && mDep && getDureeMinutes(mArr, mDep) <= 0) {
        showToast('Garderie matin : départ incohérent', true);
        return;
      }
      if ((sArr && !sDep) || (!sArr && sDep)) {
        showToast('Garderie soir : arrivée et départ requis', true);
        return;
      }
      if (sArr && sDep && getDureeMinutes(sArr, sDep) <= 0) {
        showToast('Garderie soir : départ incohérent', true);
        return;
      }

      const durM = getDureeMinutes(mArr, mDep);
      const durS = getDureeMinutes(sArr, sDep);

      const localEntry = {
        date,
        periode: document.getElementById('periodeInput').value,
        cantine: document.getElementById('cantineInput').checked,
        matinArr: mArr || '',
        matinDep: mDep || '',
        dureeMatin: durM,
        soirArr: sArr || '',
        soirDep: sDep || '',
        dureeSoir: durS,
        centrePresence: document.getElementById('centrePresence').value,
        centreRepas: document.getElementById('centreRepas').checked,
        notes: document.getElementById('notesInput').value.trim()
      };

      // Sauvegarde locale instantanée
      const idx = records.findIndex(r => r.date === date);
      if (idx >= 0) records[idx] = localEntry;
      else records.push(localEntry);
      records.sort((a, b) => new Date(b.date) - new Date(a.date));
      localStorage.setItem('perisco_data', JSON.stringify(records));
      actualiserAffichage();

      // Envoi distant Supabase
      if (isSupabaseConfigured) {
        showToast('Synchronisation cloud...');
        const payload = {
          date: date,
          periode: localEntry.periode,
          cantine: localEntry.cantine,
          matin_arr: mArr || null,
          matin_dep: mDep || null,
          duree_matin: durM,
          soir_arr: sArr || null,
          soir_dep: sDep || null,
          duree_soir: durS,
          centre_presence: localEntry.centrePresence,
          centre_repas: localEntry.centreRepas,
          notes: localEntry.notes
        };

        const { error } = await supabaseClient.from('pointages').upsert(payload);
        if (error) {
          showToast('Erreur de synchronisation cloud', true);
          console.error(error);
        } else {
          showToast('Journée synchronisée');
        }
      } else {
        showToast('Journée enregistrée (local)');
      }
    });

    // --- 6. SUPPRESSION ---
    async function supprimerLigne(date) {
      if (!confirm(`Supprimer la saisie du ${formaterDateFr(date)} ?`)) return;

      // Suppression locale
      records = records.filter(r => r.date !== date);
      localStorage.setItem('perisco_data', JSON.stringify(records));
      actualiserAffichage();

      // Suppression distante
      if (isSupabaseConfigured) {
        const { error } = await supabaseClient.from('pointages').delete().eq('date', date);
        if (error) showToast('Erreur suppression cloud', true);
        else showToast('Enregistrement supprimé');
      } else {
        showToast('Enregistrement supprimé');
      }
    }

    // --- 7. RENDU DU TABLEAU DE BORD ---
    function actualiserAffichage() {
      const tarifs = getTarifs();
      const selectedMonth = document.getElementById('filtreMois').value;

      let totRepas = 0;
      let totMinGarderie = 0;
      let totJoursCentre = 0;
      let coutTotal = 0;

      const itemsMois = records.filter(r => r.date.startsWith(selectedMonth));

      itemsMois.forEach(r => {
        if (r.cantine) { totRepas++; coutTotal += tarifs.cantine; }
        const min = (r.dureeMatin || 0) + (r.dureeSoir || 0);
        totMinGarderie += min;
        coutTotal += (min / 60) * tarifs.garderieHoraire;

        if (r.centrePresence === 'Journée entière') { totJoursCentre += 1; coutTotal += tarifs.centreJour; }
        else if (r.centrePresence && r.centrePresence.includes('Demi-journée')) { totJoursCentre += 0.5; coutTotal += tarifs.centreDemi; }
        if (r.centreRepas) coutTotal += tarifs.centreRepas;
      });

      const h = Math.floor(totMinGarderie / 60);
      const m = totMinGarderie % 60;

      document.getElementById('statRepas').innerText = totRepas;
      document.getElementById('statGarderie').innerText = `${h}h${String(m).padStart(2,'0')}`;
      document.getElementById('statCentre').innerText = `${totJoursCentre} j`;
      document.getElementById('statCout').innerText = coutTotal.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';

      const container = document.getElementById('historiqueList');
      if (itemsMois.length === 0) {
        container.innerHTML = '<div class="py-4 text-center text-slate-400">Aucune donnée pour ce mois.</div>';
        return;
      }

      container.innerHTML = itemsMois.map(r => `
        <div class="pt-2 pb-1 flex justify-between items-start">
          <div>
            <div class="font-bold text-slate-800">${formaterDateFr(r.date)} <span class="text-[10px] font-normal text-slate-500">(${r.periode})</span></div>
            <div class="text-[11px] text-slate-600 mt-0.5 space-x-1">
              ${r.cantine ? '<span class="bg-blue-100 text-blue-800 px-1 rounded">Cantine</span>' : ''}
              ${(r.dureeMatin + r.dureeSoir) > 0 ? `<span class="bg-amber-100 text-amber-900 px-1 rounded">Garderie: ${Math.floor((r.dureeMatin + r.dureeSoir)/60)}h${String((r.dureeMatin + r.dureeSoir)%60).padStart(2,'0')}</span>` : ''}
              ${r.centrePresence !== 'Aucun' ? `<span class="bg-purple-100 text-purple-900 px-1 rounded">Centre: ${r.centrePresence}</span>` : ''}
            </div>
            ${r.notes ? `<div class="text-[10px] text-slate-400 italic mt-0.5">${r.notes}</div>` : ''}
          </div>
          <button onclick="supprimerLigne('${r.date}')" class="text-slate-300 hover:text-red-500 text-base px-2">✕</button>
        </div>
      `).join('');
    }

    function formaterDateFr(dateStr) {
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    }

    // --- 8. EXPORTATION EXCEL ---
    function exporterExcel() {
      if (!records.length) return showToast('Aucune donnée à exporter', true);

      const rows = records.map(r => ({
        "Date": r.date,
        "Période": r.periode,
        "Cantine": r.cantine ? "Oui" : "Non",
        "Matin Arrivée": r.matinArr || "",
        "Matin Départ": r.matinDep || "",
        "Matin Durée (min)": r.dureeMatin || 0,
        "Soir Arrivée": r.soirArr || "",
        "Soir Départ": r.soirDep || "",
        "Soir Durée (min)": r.dureeSoir || 0,
        "Total Garderie (min)": (r.dureeMatin || 0) + (r.dureeSoir || 0),
        "Centre Présence": r.centrePresence,
        "Centre Repas": r.centreRepas ? "Oui" : "Non",
        "Remarques": r.notes || ""
      }));

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Journal");
      XLSX.writeFile(wb, `Périscolaire_${document.getElementById('filtreMois').value}.xlsx`);
    }

    // --- 9. DÉMARRAGE ---
    const nowIso = new Date().toISOString();
    document.getElementById('filtreMois').value = nowIso.slice(0, 7);
    initAujourdhui();
    chargerDonneesSupabase();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
