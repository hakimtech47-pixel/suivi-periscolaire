<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Périscolaire</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-10">

  <header class="bg-blue-600 text-white p-4 sticky top-0 shadow-md flex justify-between items-center z-10">
    <h1 class="text-lg font-bold">Suivi Périscolaire</h1>
    <button onclick="exporterExcel()" class="bg-blue-800 hover:bg-blue-900 text-xs px-3 py-1.5 rounded-lg border border-blue-400 font-medium">
      Export Excel
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Formulaire de saisie -->
    <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200">
      <h2 class="font-semibold text-slate-700 mb-3 text-base border-b pb-1">Saisie du jour</h2>
      <form id="periscoForm" class="space-y-3">
        
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Date</label>
          <input type="date" id="dateInput" required class="w-full bg-slate-50 border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Période</label>
          <select id="periodeInput" class="w-full bg-slate-50 border rounded-lg p-2 text-sm">
            <option value="Scolaire">Période scolaire</option>
            <option value="Mercredi">Mercredi</option>
            <option value="Vacances">Vacances scolaires</option>
          </select>
        </div>

        <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-lg border">
          <span class="text-sm font-medium">Repas Cantine</span>
          <input type="checkbox" id="cantineInput" class="w-5 h-5 accent-blue-600">
        </div>

        <!-- Garderie Matin -->
        <div class="p-2.5 bg-slate-50 rounded-lg border space-y-2">
          <span class="text-xs font-bold text-slate-500 uppercase block">Garderie Matin</span>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] text-slate-400">Arrivée</label>
              <input type="time" id="matinArrivee" class="w-full bg-white border rounded p-1 text-sm">
            </div>
            <div>
              <label class="text-[11px] text-slate-400">Départ</label>
              <input type="time" id="matinDepart" class="w-full bg-white border rounded p-1 text-sm">
            </div>
          </div>
        </div>

        <!-- Garderie Soir -->
        <div class="p-2.5 bg-slate-50 rounded-lg border space-y-2">
          <span class="text-xs font-bold text-slate-500 uppercase block">Garderie Soir</span>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] text-slate-400">Arrivée</label>
              <input type="time" id="soirArrivee" class="w-full bg-white border rounded p-1 text-sm">
            </div>
            <div>
              <label class="text-[11px] text-slate-400">Départ</label>
              <input type="time" id="soirDepart" class="w-full bg-white border rounded p-1 text-sm">
            </div>
          </div>
        </div>

        <!-- Centre de Loisirs -->
        <div class="p-2.5 bg-slate-50 rounded-lg border space-y-2">
          <span class="text-xs font-bold text-slate-500 uppercase block">Centre de Loisirs</span>
          <select id="centrePresence" class="w-full bg-white border rounded p-1.5 text-sm">
            <option value="Aucun">Aucun</option>
            <option value="Journée entière">Journée entière</option>
            <option value="Demi-journée matin">Demi-journée matin</option>
            <option value="Demi-journée après-midi">Demi-journée après-midi</option>
          </select>
          <div class="flex items-center justify-between pt-1">
            <span class="text-xs font-medium">Repas au Centre</span>
            <input type="checkbox" id="centreRepas" class="w-4 h-4 accent-blue-600">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Notes</label>
          <input type="text" id="notesInput" placeholder="Optionnel..." class="w-full bg-slate-50 border rounded-lg p-2 text-sm">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow">
          Enregistrer la journée
        </button>
      </form>
    </div>

    <!-- Récapitulatif du mois en cours -->
    <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200">
      <h2 class="font-semibold text-slate-700 mb-2 text-base">Bilan du mois en cours</h2>
      <div class="grid grid-cols-2 gap-3 text-center">
        <div class="p-3 bg-blue-50 rounded-lg">
          <div class="text-xs text-blue-600 font-medium">Repas Cantine</div>
          <div id="statRepas" class="text-xl font-bold text-blue-900">0</div>
        </div>
        <div class="p-3 bg-blue-50 rounded-lg">
          <div class="text-xs text-blue-600 font-medium">Heures Garderie</div>
          <div id="statGarderie" class="text-xl font-bold text-blue-900">0h00</div>
        </div>
        <div class="p-3 bg-slate-50 rounded-lg">
          <div class="text-xs text-slate-500 font-medium">Jours Centre</div>
          <div id="statCentre" class="text-xl font-bold text-slate-800">0</div>
        </div>
        <div class="p-3 bg-emerald-50 rounded-lg">
          <div class="text-xs text-emerald-600 font-medium">Coût Estimé</div>
          <div id="statCout" class="text-xl font-bold text-emerald-800">0,00 €</div>
        </div>
      </div>
    </div>

    <!-- Dernières saisies -->
    <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200">
      <h2 class="font-semibold text-slate-700 mb-2 text-base">Historique récent</h2>
      <div id="historiqueList" class="space-y-2 text-xs divide-y"></div>
    </div>

  </main>

  <script>
    // Tarifs par défaut
    const TARIFS = { cantine: 4.50, garderieHoraire: 2.50, centreJour: 15.00, centreDemi: 8.50, centreRepas: 4.50 };

    // Initialisation date du jour
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

    function getDureeMinutes(arr, dep) {
      if (!arr || !dep) return 0;
      const [h1, m1] = arr.split(':').map(Number);
      const [h2, m2] = dep.split(':').map(Number);
      return Math.max(0, (h2 * 60 + m2) - (h1 * 60 + m1));
    }

    function getRecords() {
      return JSON.parse(localStorage.getItem('perisco_data') || '[]');
    }

    function saveRecords(data) {
      localStorage.setItem('perisco_data', JSON.stringify(data));
      actualiserAffichage();
    }

    document.getElementById('periscoForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const records = getRecords();
      const date = document.getElementById('dateInput').value;
      const matinArr = document.getElementById('matinArrivee').value;
      const matinDep = document.getElementById('matinDepart').value;
      const soirArr = document.getElementById('soirArrivee').value;
      const soirDep = document.getElementById('soirDepart').value;
      
      const dureeMatin = getDureeMinutes(matinArr, matinDep);
      const dureeSoir = getDureeMinutes(soirArr, soirDep);

      const entry = {
        date,
        periode: document.getElementById('periodeInput').value,
        cantine: document.getElementById('cantineInput').checked,
        matinArr, matinDep, dureeMatin,
        soirArr, soirDep, dureeSoir,
        centrePresence: document.getElementById('centrePresence').value,
        centreRepas: document.getElementById('centreRepas').checked,
        notes: document.getElementById('notesInput').value
      };

      // Remplacement si la date existe déjà, sinon ajout
      const index = records.findIndex(r => r.date === date);
      if (index >= 0) records[index] = entry;
      else records.push(entry);

      records.sort((a, b) => new Date(b.date) - new Date(a.date));
      saveRecords(records);

      // Reset partiel
      document.getElementById('matinArrivee').value = '';
      document.getElementById('matinDepart').value = '';
      document.getElementById('soirArrivee').value = '';
      document.getElementById('soirDepart').value = '';
      document.getElementById('notesInput').value = '';
      alert('Journée enregistrée avec succès !');
    });

    function actualiserAffichage() {
      const records = getRecords();
      const currentMonth = new Date().toISOString().slice(0, 7);
      
      let totRepas = 0;
      let totMinutesGarderie = 0;
      let totJoursCentre = 0;
      let coutTotal = 0;

      records.forEach(r => {
        if (r.date.startsWith(currentMonth)) {
          if (r.cantine) { totRepas++; coutTotal += TARIFS.cantine; }
          const min = (r.dureeMatin || 0) + (r.dureeSoir || 0);
          totMinutesGarderie += min;
          coutTotal += (min / 60) * TARIFS.garderieHoraire;

          if (r.centrePresence === 'Journée entière') { totJoursCentre += 1; coutTotal += TARIFS.centreJour; }
          else if (r.centrePresence.includes('Demi-journée')) { totJoursCentre += 0.5; coutTotal += TARIFS.centreDemi; }
          if (r.centreRepas) coutTotal += TARIFS.centreRepas;
        }
      });

      const h = Math.floor(totMinutesGarderie / 60);
      const m = totMinutesGarderie % 60;

      document.getElementById('statRepas').innerText = totRepas;
      document.getElementById('statGarderie').innerText = `${h}h${m.toString().padStart(2, '0')}`;
      document.getElementById('statCentre').innerText = totJoursCentre;
      document.getElementById('statCout').innerText = coutTotal.toFixed(2) + ' €';

      // Rendu Historique récent (5 derniers)
      const container = document.getElementById('historiqueList');
      container.innerHTML = records.slice(0, 5).map(r => `
        <div class="pt-2 flex justify-between items-center">
          <div>
            <span class="font-bold text-slate-700">${r.date}</span> (${r.periode})
            <div class="text-[11px] text-slate-500">
              ${r.cantine ? 'Cantine • ' : ''}Garderie: ${Math.round((r.dureeMatin + r.dureeSoir)/60*10)/10}h • Centre: ${r.centrePresence}
            </div>
          </div>
          <button onclick="supprimerLigne('${r.date}')" class="text-red-500 hover:text-red-700">✕</button>
        </div>
      `).join('');
    }

    function supprimerLigne(date) {
      if (confirm(`Supprimer l'enregistrement du ${date} ?`)) {
        const records = getRecords().filter(r => r.date !== date);
        saveRecords(records);
      }
    }

    function exporterExcel() {
      const records = getRecords();
      if (!records.length) return alert('Aucune donnée à exporter.');

      const dataToExport = records.map(r => ({
        "Date": r.date,
        "Période": r.periode,
        "Cantine": r.cantine ? "Oui" : "Non",
        "Matin Arrivée": r.matinArr,
        "Matin Départ": r.matinDep,
        "Matin Durée (min)": r.dureeMatin,
        "Soir Arrivée": r.soirArr,
        "Soir Départ": r.soirDep,
        "Soir Durée (min)": r.dureeSoir,
        "Total Garderie (min)": r.dureeMatin + r.dureeSoir,
        "Centre Présence": r.centrePresence,
        "Centre Repas": r.centreRepas ? "Oui" : "Non",
        "Remarques": r.notes
      }));

      const ws = XLSX.utils.json_to_sheet(dataToExport);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Saisie");
      XLSX.writeFile(wb, `Suivi_Periscolaire_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // Enregistrement Service Worker pour le mode PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    actualiserAffichage();
  </script>
</body>
</html>
